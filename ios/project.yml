# XcodeGen project for the iOS app – generate with:  cd ios && xcodegen generate
name: WhatsForDinner

options:
  bundleIdPrefix: de.nevbie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # the FirebaseConfig.plist copy script needs to read the source folder
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  WFDCore:
    path: WFDCore

targets:
  WhatsForDinner:
    type: application
    platform: iOS
    sources:
      - path: WhatsForDinner
        excludes:
          - "FirebaseConfig.plist"
          - "FirebaseConfig.example.plist"
          - "Info.plist"
      # shared data of all three apps, referenced in place (not copied into ios/)
      - path: ../shared/dishes.json
        buildPhase: resources
      - path: ../shared/strings.json
        buildPhase: resources
    info:
      path: WhatsForDinner/Info.plist
      properties:
        CFBundleDisplayName: "Was gibt's heute?"
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de, en]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.nevbie.whatsfordinner
        PRODUCT_NAME: WhatsForDinner
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # set your (free) Apple ID team in Xcode → Signing & Capabilities
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: WFDCore
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAuth
    # FirebaseConfig.plist is optional: copied into the app only when it exists. Without it the app runs
    # in local-only mode. (A plain resource entry would fail the build when the file is missing.)
    postCompileScripts:
      - name: Copy optional FirebaseConfig.plist
        basedOnDependencyAnalysis: false
        script: |
          SRC="${SRCROOT}/WhatsForDinner/FirebaseConfig.plist"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          if [ -f "$SRC" ]; then
            mkdir -p "$DEST"
            cp "$SRC" "$DEST/FirebaseConfig.plist"
            echo "FirebaseConfig.plist copied – sync enabled"
          else
            rm -f "$DEST/FirebaseConfig.plist"
            echo "No FirebaseConfig.plist – local-only build"
          fi

  WhatsForDinnerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhatsForDinnerTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.nevbie.whatsfordinner.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WhatsForDinner

schemes:
  WhatsForDinner:
    build:
      targets:
        WhatsForDinner: all
        WhatsForDinnerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WhatsForDinnerTests
    archive:
      config: Release
